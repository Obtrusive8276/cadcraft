# Personal build of this fork: compiles cadcraft.exe (the app) and cadcraft-cli.exe (the command
# line tool) for Windows x64 and publishes them as a GitHub release of the fork.
#
# It reuses packaging/windows/package.ps1, the script the project's own release uses, so the
# binaries are built the same way (release profile, static C runtime, PE header checks). Nothing is
# signed: Windows SmartScreen will warn the first time the exe is run.
#
# Run it by hand: Actions tab > "Windows exe" > Run workflow.
name: Windows exe

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. palette-1 (empty: windows-build-<run number>)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      # Creates the tag and the release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Optional build input of the project (extra fonts), at the commit the project builds with.
      - name: Fonts (craft-fonts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Build cadcraft.exe, cadcraft-cli.exe, MSI and portable zip
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: pwsh packaging/windows/package.ps1 -Arch x64

      - uses: actions/upload-artifact@v4
        with:
          name: cadcraft-windows-x64
          path: dist/release/*
          if-no-files-found: error

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag != '' && inputs.tag || format('windows-build-{0}', github.run_number) }}
        run: |
          gh release create "$TAG" dist/release/* \
            --target "$GITHUB_SHA" \
            --title "CADCraft Windows build $TAG" \
            --notes "Unsigned Windows x64 build of ${GITHUB_REF_NAME} at ${GITHUB_SHA}. Contains cadcraft.exe (the app) and cadcraft-cli.exe in the portable zip, and an MSI installer." \
            --prerelease
